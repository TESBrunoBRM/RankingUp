<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Push Ups Detector - MediaPipe</title>
  
  <!-- MediaPipe dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #0c0c12; overflow: hidden;
      font-family: monospace;
    }
    #container {
      position: relative; width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
    }
    video {
      display: none; /* Hidden, we render to canvas instead */
    }
    canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; transform: scaleX(-1); /* mirror */
      z-index: 1;
    }
    #loading {
      position: absolute; z-index: 10;
      color: #CCFF00; font-size: 14px; font-weight: bold;
      text-align: center;
      background: rgba(12, 12, 18, 0.9);
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    .spinner {
      border: 4px solid rgba(204,255,0,0.1);
      width: 40px; height: 40px;
      border-radius: 50%;
      border-left-color: #CCFF00;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    #hud {
      position: absolute; top: 15px; left: 15px; right: 15px;
      z-index: 5; pointer-events: none;
      display: flex; justify-content: space-between; align-items: center;
    }
    .hud-box {
      background: rgba(15, 15, 25, 0.85);
      border: 1px solid #CCFF00;
      border-radius: 8px;
      padding: 6px 12px;
      color: #CCFF00;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(204,255,0,0.2);
    }
    #status-box {
      border-color: #FF007F;
      color: #FF007F;
      box-shadow: 0 0 10px rgba(255,0,127,0.2);
    }
    #depth-bar-container {
      position: absolute; right: 15px; top: 70px; bottom: 70px;
      width: 12px; background: rgba(255,255,255,0.1);
      border-radius: 6px; overflow: hidden; z-index: 5;
    }
    #depth-bar-fill {
      position: absolute; bottom: 0; width: 100%;
      background: #CCFF00; border-radius: 6px;
      transition: height 0.1s ease;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div id="loading-text">Cargando MediaPipe AI...</div>
  </div>

  <div id="container">
    <video id="webcam" playsinline muted></video>
    <canvas id="canvas"></canvas>
    
    <div id="hud">
      <div class="hud-box" id="info-box">Buscando cuerpo...</div>
      <div class="hud-box" id="status-box">Listo</div>
    </div>

    <div id="depth-bar-container">
      <div id="depth-bar-fill" style="height: 0%;"></div>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const loadingDiv = document.getElementById('loading');
    const loadingText = document.getElementById('loading-text');
    const infoBox = document.getElementById('info-box');
    const statusBox = document.getElementById('status-box');
    const depthFill = document.getElementById('depth-bar-fill');

    let state = 'UP';
    let lastPushupTime = 0;

    function sendToApp(data) {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify(data));
      }
    }

    // Initialize MediaPipe Pose
    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults(onResults);

    // Camera setup
    const camera = new Camera(video, {
      onFrame: async () => {
        await pose.send({ image: video });
      },
      width: 640,
      height: 480,
      facingMode: 'user'
    });

    loadingText.innerText = "Iniciando cámara frontal...";
    camera.start()
      .then(() => {
        loadingDiv.style.display = 'none';
      })
      .catch(err => {
        loadingText.innerText = "Error: Permiso de cámara denegado o no disponible.";
        sendToApp({ type: 'error', message: err.message });
      });

    function onResults(results) {
      if (canvas.width !== results.image.width) {
        canvas.width = results.image.width;
        canvas.height = results.image.height;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

      // Draw grid
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += 40) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
      }
      for (let j = 0; j < canvas.height; j += 40) {
        ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
      }

      if (results.poseLandmarks) {
        infoBox.innerText = "Cuerpo Detectado";
        infoBox.style.borderColor = "#CCFF00";
        infoBox.style.color = "#CCFF00";

        const landmarks = results.poseLandmarks;
        const nose = landmarks[0];
        const lShoulder = landmarks[11];
        const rShoulder = landmarks[12];
        const lWrist = landmarks[15];
        const rWrist = landmarks[16];

        // Draw neon blue skeleton
        ctx.strokeStyle = '#00F0FF';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(lShoulder.x * canvas.width, lShoulder.y * canvas.height);
        ctx.lineTo(rShoulder.x * canvas.width, rShoulder.y * canvas.height);
        ctx.stroke();

        ctx.fillStyle = '#CCFF00';
        [nose, lShoulder, rShoulder, lWrist, rWrist].forEach(pt => {
          ctx.beginPath();
          ctx.arc(pt.x * canvas.width, pt.y * canvas.height, 6, 0, 2 * Math.PI);
          ctx.fill();
        });

        // PUSHUP LOGIC
        const shoulderY = (lShoulder.y + rShoulder.y) / 2;
        const dist = shoulderY - nose.y;

        const shoulderDist = Math.sqrt(
          Math.pow(lShoulder.x - rShoulder.x, 2) + Math.pow(lShoulder.y - rShoulder.y, 2)
        );

        const normalizedVal = dist / shoulderDist;

        // Pushup detection limits:
        const minVal = 0.28;
        const maxVal = 0.58;
        const percent = Math.min(100, Math.max(0, ((normalizedVal - minVal) / (maxVal - minVal)) * 100));
        const invertedPercent = 100 - percent;
        
        depthFill.style.height = `${invertedPercent}%`;

        const now = Date.now();
        if (state === 'UP') {
          if (invertedPercent > 70) {
            state = 'DOWN';
            statusBox.innerText = 'ABAJO';
            statusBox.style.borderColor = '#CCFF00';
            statusBox.style.color = '#CCFF00';
            sendToApp({ type: 'state', value: 'DOWN' });
          }
        } else if (state === 'DOWN') {
          if (invertedPercent < 35 && (now - lastPushupTime > 800)) {
            state = 'UP';
            lastPushupTime = now;
            statusBox.innerText = 'ARRIBA';
            statusBox.style.borderColor = '#FF007F';
            statusBox.style.color = '#FF007F';
            sendToApp({ type: 'state', value: 'UP' });
            sendToApp({ type: 'pushup' });
          }
        }
      } else {
        infoBox.innerText = "Buscando cuerpo...";
        infoBox.style.borderColor = "#FF9500";
        infoBox.style.color = "#FF9500";
      }
    }
  </script>
</body>
</html>
