<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Push Ups Detector - MediaPipe</title>
  
  <!-- MediaPipe dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #0c0c12; overflow: hidden;
      font-family: monospace;
    }
    #container {
      position: relative; width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
    }
    video {
      display: none;
    }
    canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; transform: scaleX(-1); /* mirror */
      z-index: 1;
    }
    #loading {
      position: absolute; z-index: 10;
      color: #CCFF00; font-size: 14px; font-weight: bold;
      text-align: center;
      background: rgba(12, 12, 18, 0.95);
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    .spinner {
      border: 4px solid rgba(204,255,0,0.1);
      width: 40px; height: 40px;
      border-radius: 50%;
      border-left-color: #CCFF00;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    #countdown-overlay {
      position: absolute; z-index: 8;
      background: rgba(12, 12, 18, 0.8);
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      color: #FFF;
      pointer-events: none;
    }
    #countdown-number {
      font-size: 80px; font-weight: 900; color: #CCFF00;
      text-shadow: 0 0 20px rgba(204,255,0,0.6);
      margin-top: 15px;
    }
    #countdown-instruction {
      font-size: 14px; color: #aaa; text-align: center;
      padding: 0 30px; line-height: 20px;
    }

    #hud {
      position: absolute; top: 15px; left: 15px; right: 15px;
      z-index: 5; pointer-events: none;
      display: flex; justify-content: space-between; align-items: center;
    }
    .hud-box {
      background: rgba(15, 15, 25, 0.85);
      border: 1px solid #CCFF00;
      border-radius: 8px;
      padding: 6px 12px;
      color: #CCFF00;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(204,255,0,0.2);
    }
    #status-box {
      border-color: #FF007F;
      color: #FF007F;
      box-shadow: 0 0 10px rgba(255,0,127,0.2);
    }
    #depth-bar-container {
      position: absolute; right: 15px; top: 70px; bottom: 70px;
      width: 12px; background: rgba(255,255,255,0.1);
      border-radius: 6px; overflow: hidden; z-index: 5;
    }
    #depth-bar-fill {
      position: absolute; bottom: 0; width: 100%;
      background: #CCFF00; border-radius: 6px;
      transition: height 0.1s ease;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div id="loading-text">Cargando MediaPipe AI...</div>
  </div>

  <div id="countdown-overlay" style="display: none;">
    <div id="countdown-instruction">Acomoda la cámara apuntando a tu perfil o frente.</div>
    <div id="countdown-number">5</div>
  </div>

  <div id="container">
    <video id="webcam" playsinline muted></video>
    <canvas id="canvas"></canvas>
    
    <div id="hud">
      <div class="hud-box" id="info-box">Buscando cuerpo...</div>
      <div class="hud-box" id="status-box">Calibrando</div>
    </div>

    <div id="depth-bar-container">
      <div id="depth-bar-fill" style="height: 0%;"></div>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const loadingDiv = document.getElementById('loading');
    const loadingText = document.getElementById('loading-text');
    const countdownOverlay = document.getElementById('countdown-overlay');
    const countdownNumber = document.getElementById('countdown-number');
    const infoBox = document.getElementById('info-box');
    const statusBox = document.getElementById('status-box');
    const depthFill = document.getElementById('depth-bar-fill');

    let state = 'UP';
    let lastPushupTime = 0;
    
    // Autocalibration histories
    let yHistory = [];
    let isCalibrated = false;
    let countdownVal = 5;

    function sendToApp(data) {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify(data));
      }
    }

    // Initialize MediaPipe Pose
    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults(onResults);

    const camera = new Camera(video, {
      onFrame: async () => {
        await pose.send({ image: video });
      },
      width: 640,
      height: 480,
      facingMode: 'user'
    });

    loadingText.innerText = "Iniciando cámara frontal...";
    camera.start()
      .then(() => {
        loadingDiv.style.display = 'none';
        startCountdown();
      })
      .catch(err => {
        loadingText.innerText = "Error: Permiso de cámara denegado.";
        sendToApp({ type: 'error', message: err.message });
      });

    function startCountdown() {
      countdownOverlay.style.display = 'flex';
      const interval = setInterval(() => {
        countdownVal--;
        if (countdownVal > 0) {
          countdownNumber.innerText = countdownVal;
        } else if (countdownVal === 0) {
          countdownNumber.innerText = "¡EMPIEZA!";
        } else {
          clearInterval(interval);
          countdownOverlay.style.display = 'none';
          isCalibrated = true;
          statusBox.innerText = "UP";
        }
      }, 1000);
    }

    function onResults(results) {
      if (canvas.width !== results.image.width) {
        canvas.width = results.image.width;
        canvas.height = results.image.height;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

      // Draw HUD grid
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += 40) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
      }
      for (let j = 0; j < canvas.height; j += 40) {
        ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
      }

      if (results.poseLandmarks) {
        infoBox.innerText = isCalibrated ? "LISTO PARA FLEXIONES" : "Acomodando cámara...";
        infoBox.style.borderColor = isCalibrated ? "#CCFF00" : "#FF9500";
        infoBox.style.color = isCalibrated ? "#CCFF00" : "#FF9500";

        const landmarks = results.poseLandmarks;
        const nose = landmarks[0];
        const lShoulder = landmarks[11];
        const rShoulder = landmarks[12];

        // Draw neon blue skeleton shoulder
        ctx.strokeStyle = '#00F0FF';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(lShoulder.x * canvas.width, lShoulder.y * canvas.height);
        ctx.lineTo(rShoulder.x * canvas.width, rShoulder.y * canvas.height);
        ctx.stroke();

        ctx.fillStyle = '#CCFF00';
        [nose, lShoulder, rShoulder].forEach(pt => {
          ctx.beginPath();
          ctx.arc(pt.x * canvas.width, pt.y * canvas.height, 6, 0, 2 * Math.PI);
          ctx.fill();
        });

        // AUTOCALIBRATING Y-DISPLACEMENT DETECTION
        const yShoulder = (lShoulder.y + rShoulder.y) / 2;

        if (isCalibrated) {
          yHistory.push(yShoulder);
          // Keep last 4 seconds (120 frames at ~30fps)
          if (yHistory.length > 120) yHistory.shift();

          const maxY = Math.max(...yHistory);
          const minY = Math.min(...yHistory);
          const range = maxY - minY;

          // Only detect if user is moving significantly (range > 0.08 of screen height)
          if (range > 0.08) {
            // Percent represents position: 0 is top (arms extended), 1 is bottom (down)
            const percent = (yShoulder - minY) / range;
            depthFill.style.height = `${percent * 100}%`;

            const now = Date.now();
            if (state === 'UP') {
              // Went down (depth > 75% of range)
              if (percent > 0.75) {
                state = 'DOWN';
                statusBox.innerText = 'ABAJO';
                statusBox.style.borderColor = '#CCFF00';
                statusBox.style.color = '#CCFF00';
                sendToApp({ type: 'state', value: 'DOWN' });
              }
            } else if (state === 'DOWN') {
              // Pushed back up (depth < 25% of range)
              if (percent < 0.25 && (now - lastPushupTime > 800)) {
                state = 'UP';
                lastPushupTime = now;
                statusBox.innerText = 'ARRIBA';
                statusBox.style.borderColor = '#FF007F';
                statusBox.style.color = '#FF007F';
                sendToApp({ type: 'state', value: 'UP' });
                sendToApp({ type: 'pushup' });
              }
            }
          } else {
            // Calm state
            depthFill.style.height = `0%`;
          }
        } else {
          // Clear history during countdown calibration
          yHistory = [];
          statusBox.innerText = "Calibrando";
          statusBox.style.borderColor = "#FF9500";
          statusBox.style.color = "#FF9500";
        }
      } else {
        infoBox.innerText = "Buscando cuerpo...";
        infoBox.style.borderColor = "#FF9500";
        infoBox.style.color = "#FF9500";
      }
    }
  </script>
</body>
</html>
